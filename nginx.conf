# Serves the built client for the Compose stack.
#
# Port 5173 so the published address is the one every doc, `task dev`, and the
# Playwright config already name — the container swap is invisible.
#
# The app has no client-side router, but the SPA fallback costs nothing and
# keeps a hand-typed deep link from 404ing if one is ever added.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
